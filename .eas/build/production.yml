build:
  name: iOS Production
  steps:
    - eas/checkout

    - run:
        name: Install dependencies
        command: |
          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"
          npm install --no-audit
          echo "expo binary: $(./node_modules/.bin/expo --version)"

    - run:
        name: Prebuild (using local Expo binary)
        command: |
          ./node_modules/.bin/expo prebuild --clean --platform ios --non-interactive

    - eas/ios_build
